<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Chicos VS Chicas - Overlay OBS</title>
<!-- OBS: Fuente Navegador > "Archivo local" > este archivo. 1920x1080, posicion 0,0, fondo transparente.
     Lee http://127.0.0.1:8769/state (CONTRATO.md, /state v2). Sin dependencias externas.
     Capas en OBS (abajo -> arriba): fondo > 3 camaras > ESTE overlay. Tildar "Controlar el audio mediante OBS". -->
<style>
@property --ca{syntax:'<color>';inherits:true;initial-value:#38bdf8}
@property --cb{syntax:'<color>';inherits:true;initial-value:#1E5BFF}
@property --cc{syntax:'<color>';inherits:true;initial-value:#ff2bb0}
@property --cd{syntax:'<color>';inherits:true;initial-value:#E6007E}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent!important;font-family:'Segoe UI',Arial,sans-serif;color:#fff}
#root{position:absolute;inset:0;transition:opacity .35s}
#root.off{opacity:0}
.abs{position:absolute}
.guia{position:absolute;border:2px dashed #0f0;background:rgba(0,255,0,.08);display:none;font:700 22px Arial;color:#0f0;padding:4px}
body.g .guia{display:block}
/* ---------- aro de turno (respira) ---------- */
.ring{position:absolute;border:5px solid var(--c);border-radius:8px;opacity:0;transition:opacity .45s;pointer-events:none;box-shadow:0 0 22px var(--c),0 0 48px var(--c),inset 0 0 18px var(--c)}
.ring.on{opacity:1;animation:ringp 2s ease-in-out infinite}
@keyframes ringp{0%,100%{opacity:.6}50%{opacity:1}}
/* ---------- comodines ---------- */
.cm{position:absolute;will-change:transform,opacity;transition:opacity .45s,filter .45s}
.cm img{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .35s}
.cm .on{animation:resp 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.cm .off{opacity:0}
.cm.used .on{opacity:0;animation:none}
.cm.used .off{opacity:1}
.cm.noval{opacity:.28;filter:grayscale(.85)}
.cm .fb{position:absolute;inset:6%;border-radius:50%;display:none;align-items:center;justify-content:center;background:#000;border:5px solid var(--tc);color:#fff;
  font:900 54px 'Segoe UI Black',Arial,sans-serif;text-shadow:0 0 6px #fff,0 0 18px var(--tc),0 0 34px var(--tc);box-shadow:0 0 18px var(--tc),inset 0 0 18px var(--tc);animation:resp 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.cm.fallback .fb{display:flex}.cm.fallback img{display:none}
.cm.fallback.used .fb{border-color:#555;color:#777;text-shadow:none;box-shadow:none;animation:none;background:#111}
.cm.fallback.used .fb::after{content:'';position:absolute;left:12%;right:12%;top:46%;height:9%;background:#ff2d2d;transform:rotate(-45deg);border-radius:9px;box-shadow:0 0 14px #ff2d2d}
@keyframes resp{0%,100%{filter:brightness(.92)}50%{filter:brightness(1.2)}}
.cm.slam{animation:salto .75s cubic-bezier(.2,.9,.3,1.2);z-index:5}
.cm.slam .on{animation:destello .45s ease-out forwards}
.cm.slam .off{animation:cae .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes salto{0%{transform:scale(1)}18%{transform:scale(1.22) rotate(-3deg)}40%{transform:scale(.95) rotate(1.5deg)}65%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes destello{0%{filter:brightness(1)}30%{filter:brightness(3.2) saturate(.4)}100%{filter:brightness(1)}}
@keyframes cae{0%{opacity:0;transform:scale(1.45)}35%{opacity:1}100%{opacity:1;transform:scale(1)}}
.cm.revive{animation:vuelve .8s ease-out;z-index:5}
.cm.revive .on{animation:enciende .8s ease-out}
@keyframes vuelve{0%{transform:scale(.9)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes enciende{0%{filter:brightness(2.4)}100%{filter:brightness(1)}}
/* ---------- marcador (arriba de la camara central) ---------- */
#mid,#av{left:760px;top:6px;width:398px;height:129px;background:#000;border:3px solid rgba(255,255,255,.16);border-radius:20px;box-shadow:0 0 18px rgba(56,189,248,.35),0 0 34px rgba(217,70,239,.25)}
#mid{display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .3s}
#mid.aviso{opacity:0}
.sc{display:flex;flex-direction:column;align-items:center;min-width:150px}
.sc .n{position:relative;z-index:0;font:900 90px/1 'Segoe UI Black','Arial Black',Impact,sans-serif;font-variant-numeric:tabular-nums;display:inline-block;color:#fff}
.sc .n::before{content:attr(data-t);position:absolute;left:0;top:0;width:100%;z-index:-1;pointer-events:none;color:var(--k);-webkit-text-stroke:5px var(--k);filter:blur(12px);animation:resp1 2.6s ease-in-out infinite}
.sc .n.pop{animation:pop .75s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.5)}100%{transform:scale(1)}}
.sc .l{font:800 17px/1 'Segoe UI',Arial,sans-serif;letter-spacing:4px;margin-top:3px;color:var(--k);text-shadow:0 0 10px var(--k)}
.sc.chicos{--k:#1E5BFF}.sc.chicos .n{text-shadow:0 0 3px #fff,0 0 10px #8ab4ff,0 0 24px #1E5BFF}
.sc.chicas{--k:#ff2bb0}.sc.chicas .n{text-shadow:0 0 3px #fff,0 0 10px #ffb3e6,0 0 24px #E6007E}
.sc.chicas .n::before{animation-delay:-1.3s}
#vs{font:900 24px 'Segoe UI Black',Arial,sans-serif;color:#fff;opacity:.8;text-shadow:0 0 12px #a78bfa;margin-top:-18px}
@keyframes resp1{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes resp2{0%,100%{opacity:1}50%{opacity:.3}}
/* ---------- aviso de comodin ---------- */
#av{display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;text-align:center;border-color:var(--c);box-shadow:0 0 22px var(--c),0 0 44px var(--c)}
#av.on{animation:avIn 3.4s ease forwards}
#av .a1{font:800 22px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;color:var(--c);text-shadow:0 0 10px var(--c)}
#av .a2{font:900 50px/1.05 'Segoe UI Black','Arial Black',Impact,sans-serif;color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--c),0 0 40px var(--c),0 0 70px var(--c)}
@keyframes avIn{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:scale(1.12)}16%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1)}}
/* ---------- cartel de ronda / tema (ABAJO de la camara central) ---------- */
#cartelw{left:709px;top:712px;width:500px;height:56px;display:flex;justify-content:center;pointer-events:none}
#cartel{min-width:300px;max-width:470px;height:56px;padding:0 20px;border-radius:16px;background:#000;border:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 14px var(--c),0 0 32px var(--c),inset 0 0 12px rgba(255,255,255,.06);opacity:0;transform:translateY(-8px) scale(.96);transition:opacity .45s,transform .45s;pointer-events:none}
#cartel.on{opacity:1;transform:none;animation:cartelp 3s ease-in-out infinite}
@keyframes cartelp{0%,100%{box-shadow:0 0 10px var(--c),0 0 24px var(--c),inset 0 0 10px rgba(255,255,255,.05)}50%{box-shadow:0 0 18px var(--c),0 0 42px var(--c),inset 0 0 14px rgba(255,255,255,.08)}}
#c1{font:900 26px/1 'Segoe UI Black','Arial Black',Impact,sans-serif;color:#fff;letter-spacing:1px;white-space:nowrap;max-width:430px;overflow:hidden;text-shadow:0 0 3px #fff,0 0 12px var(--c),0 0 26px var(--c)}
#c2{font:800 16px/1 'Segoe UI',Arial,sans-serif;color:#e0e7ff;letter-spacing:2px;margin-top:4px;white-space:nowrap;text-shadow:0 0 8px var(--c)}
/* ---------- panel inferior: negro total + neon que rota por el perimetro ---------- */
#pan{position:absolute;left:67px;width:1786px;border-radius:20px;background:#000;transition:opacity .4s,--ca .8s,--cb .8s,--cc .8s,--cd .8s}
#pan.off{opacity:0;pointer-events:none}
#pan.t-chicos{--ca:#67e8f9;--cb:#1E5BFF;--cc:#38bdf8;--cd:#1E5BFF}
#pan.t-chicas{--ca:#ff8be0;--cb:#ff2bb0;--cc:#E6007E;--cd:#ff2bb0}
.rg{position:absolute;overflow:hidden;background:rgba(120,170,255,.25);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.rg .spin{position:absolute;left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;will-change:transform;animation:rot 4.4s linear infinite;
  background:conic-gradient(transparent 0deg,var(--ca) 28deg,var(--cb) 75deg,var(--cc) 120deg,transparent 170deg,transparent 200deg,var(--cd) 228deg,var(--cb) 272deg,var(--ca) 318deg,transparent 360deg)}
.rgs{position:absolute;inset:-5px;border-radius:25px;padding:5px}
.rgg{position:absolute;inset:-12px;border-radius:32px;filter:blur(10px);opacity:.95}
.rgg .rg{inset:0;border-radius:32px;padding:12px}
@keyframes rot{to{transform:rotate(360deg)}}
#flash{position:absolute;inset:0;border-radius:20px;opacity:0;pointer-events:none;box-shadow:inset 0 0 70px 8px var(--fc),0 0 50px var(--fc)}
#flash.go{animation:flash .95s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
#barra-track{position:absolute;top:10px;left:28px;right:28px;height:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:99px;z-index:4;overflow:visible;box-shadow:inset 0 1px 5px rgba(0,0,0,.9);opacity:0;transition:opacity .3s}
#pan.jugando #barra-track{opacity:1}
#barra{position:absolute;top:0;left:0;height:100%;width:100%;transform-origin:left center;will-change:transform;background:#fff;border-radius:99px;transition:background .3s;
  box-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.95),0 0 28px rgba(147,197,253,.9),0 0 55px rgba(59,130,246,.7);animation:neonPulse 1.8s ease-in-out infinite}
#barra::before{content:'';position:absolute;top:100%;left:0;width:100%;height:12px;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent);filter:blur(4px);pointer-events:none}
#barra.amarilla::before{background:linear-gradient(180deg,rgba(250,204,21,.18),transparent)}
#barra.roja::before{background:linear-gradient(180deg,rgba(255,45,45,.25),transparent)}
#barra.amarilla{background:#fde047 !important;box-shadow:0 0 6px #fef9c3,0 0 14px rgba(253,224,71,.95),0 0 28px rgba(250,204,21,.9),0 0 55px rgba(234,179,8,.7) !important}
#barra.roja{background:#ff2d2d !important;animation:neonRojo .8s ease-in-out infinite !important}
@keyframes neonPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}
@keyframes neonRojo{0%,100%{opacity:1;filter:brightness(1.2);box-shadow:0 0 8px #fecaca,0 0 18px #ff2d2d,0 0 38px rgba(255,45,45,.9),0 0 70px rgba(255,0,0,.7)}50%{opacity:.7;filter:brightness(.9);box-shadow:0 0 4px #ff2d2d,0 0 10px rgba(255,45,45,.7),0 0 22px rgba(255,0,0,.5)}}
#cuerpo{position:absolute;inset:28px 30px 20px 30px;display:flex;gap:24px}
#izq{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
#tw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center}
/* letras blancas con neon: el brillo respira con capas animadas (solo opacity) */
#tit{position:relative;z-index:0;width:100%;font-family:'Segoe UI Black','Arial Black',Impact,sans-serif;font-weight:900;line-height:1.08;color:#fff;word-break:break-word;
  text-shadow:0 0 2px #fff,0 0 7px rgba(255,255,255,.95),0 0 16px var(--ca),0 0 32px var(--cb)}
#tit::before,#tit::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;z-index:-1;pointer-events:none;-webkit-text-stroke:4px currentColor}
#tit::before{color:var(--ca);filter:blur(14px);animation:resp1 3.4s ease-in-out infinite}
#tit::after{color:var(--cd);filter:blur(30px);animation:resp2 4.8s ease-in-out infinite}
#pan.inicio #tit{white-space:nowrap;letter-spacing:5px}
.animar{animation:entra .6s cubic-bezier(.2,.9,.3,1)}
@keyframes entra{0%{opacity:0;transform:translateY(22px) scale(.96)}100%{opacity:1;transform:none}}
#ops,#resp{height:98px;flex-shrink:0}
#ops{display:flex;gap:14px}
#pan.inicio #ops,#pan.inicio #reloj,#pan.inicio #resp{display:none}
.op{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:15px;background:#000;border:3px solid #38bdf8;
  box-shadow:0 0 14px rgba(56,189,248,.55),inset 0 0 14px rgba(56,189,248,.14);transition:opacity .5s,filter .5s,transform .4s,border-color .3s,box-shadow .3s,background .3s}
.op.go{animation:opIn .55s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--dl,0s)}
@keyframes opIn{0%{opacity:0;transform:translateY(26px) scale(.9)}100%{opacity:1;transform:none}}
.op .k{flex-shrink:0;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 30px 'Segoe UI Black',Arial,sans-serif;background:#38bdf8;color:#04122a;box-shadow:0 0 14px #38bdf8;transition:background .3s,box-shadow .3s,color .3s}
.op .t{flex:1;min-width:0;font:700 30px/1.1 'Segoe UI',Arial,sans-serif;text-shadow:0 0 8px rgba(125,211,252,.55);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word;transition:opacity .45s}
.op.slot .t{opacity:0}.op.slot{opacity:.45}
.op.sel{border-color:#facc15;box-shadow:0 0 18px #facc15,0 0 40px rgba(250,204,21,.55),inset 0 0 16px rgba(250,204,21,.25);transform:scale(1.03)}
.op.sel .k{background:#facc15;box-shadow:0 0 16px #facc15}
.op.ok{border-color:#22c55e;background:#03170b;box-shadow:0 0 20px #22c55e,0 0 50px rgba(34,197,94,.7),inset 0 0 18px rgba(34,197,94,.3);transform:scale(1.04)}
.op.ok .k{background:#22c55e;box-shadow:0 0 18px #22c55e;color:#fff}
.op.bad{border-color:#ef4444;background:#180404;box-shadow:0 0 20px #ef4444,0 0 44px rgba(239,68,68,.6)}
.op.bad .k{background:#ef4444;box-shadow:0 0 16px #ef4444;color:#fff}
.op.dim{opacity:.3;filter:grayscale(.6)}
.op.hid{opacity:.1;filter:grayscale(1)}.op.hid .t{opacity:0}
/* pregunta abierta: caja de respuesta */
#resp{display:none;align-items:center;justify-content:center;border-radius:15px;padding:0 24px;text-align:center;background:#000;border:3px solid #38bdf8;
  box-shadow:0 0 14px rgba(56,189,248,.55),inset 0 0 14px rgba(56,189,248,.14);transition:opacity .5s,border-color .4s,box-shadow .4s,background .4s}
#resp.abierta{display:flex}#resp.oculta{opacity:.5}
#rt{font:900 44px/1.1 'Segoe UI Black','Segoe UI',Arial,sans-serif;color:#fff;text-shadow:0 0 6px rgba(125,211,252,.8);white-space:nowrap;max-width:100%}
#resp.ok{border-color:#22c55e;background:#03170b;box-shadow:0 0 22px #22c55e,0 0 52px rgba(34,197,94,.65),inset 0 0 18px rgba(34,197,94,.3);animation:entra .6s ease}
#resp.ok #rt{text-shadow:0 0 6px #fff,0 0 16px #22c55e,0 0 34px #22c55e}
/* ---------- reloj: mismo estilo neon que el Debate ---------- */
#reloj{width:310px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#rl{font:800 18px/1 'Segoe UI',Arial,sans-serif;letter-spacing:3px;color:#93c5fd;text-shadow:0 0 10px #3b82f6;text-align:center;min-height:19px}
#rl.ll{color:#fde047;text-shadow:0 0 12px #f59e0b}
#timer{font-size:86px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff !important;background:#000;border-radius:14px;padding:0 20px;width:100%;text-align:center;border:3px solid #f1f5f9;line-height:1.1;
  box-shadow:0 0 8px rgba(255,255,255,.55),0 0 20px rgba(147,197,253,.35),inset 0 0 10px rgba(255,255,255,.12);
  text-shadow:0 0 8px rgba(255,255,255,.8),0 0 20px rgba(147,197,253,.7),0 0 34px rgba(59,130,246,.5)}
#timer.amarillo{color:#fde047 !important;border-color:#facc15 !important;
  box-shadow:0 0 7px rgba(250,204,21,.65),0 0 18px rgba(250,204,21,.4),0 0 34px rgba(250,204,21,.28),inset 0 0 10px rgba(250,204,21,.18) !important;
  text-shadow:0 0 6px rgba(254,249,195,.85),0 0 16px rgba(250,204,21,.65),0 0 32px rgba(234,179,8,.45) !important;animation:timerNeon 1.1s ease-in-out infinite !important}
#timer.rojo{color:#f87171 !important;border-color:#ef4444 !important;
  box-shadow:0 0 7px rgba(255,45,45,.7),0 0 18px rgba(255,45,45,.45),0 0 38px rgba(255,45,45,.3),inset 0 0 10px rgba(255,45,45,.2) !important;
  text-shadow:0 0 6px rgba(255,150,150,.85),0 0 16px rgba(255,45,45,.65),0 0 32px rgba(255,0,0,.45) !important;animation:timerNeon 1.1s ease-in-out infinite !important}
@keyframes timerNeon{0%,100%{filter:brightness(1.15)}50%{filter:brightness(.92)}}
</style></head><body>
<div id="root" class="off">
  <div class="guia" id="g1"></div><div class="guia" id="g2"></div><div class="guia" id="g3"></div>
  <div class="ring" id="ring-chicos" style="--c:#1E5BFF"></div>
  <div class="ring" id="ring-chicas" style="--c:#ff2bb0"></div>
  <div id="t-chicos"></div><div id="t-chicas"></div>
  <div id="mid" class="abs">
    <div class="sc chicos"><div class="n" id="pc">0</div><div class="l">CHICOS</div></div>
    <div id="vs">VS</div>
    <div class="sc chicas"><div class="n" id="pm">0</div><div class="l">CHICAS</div></div>
  </div>
  <div id="av" class="abs"><div class="a1" id="a1"></div><div class="a2" id="a2"></div></div>
  <div id="pan" class="off inicio">
    <div class="rgg"><div class="rg"><div class="spin"></div></div></div>
    <div class="rgs rg"><div class="spin"></div></div>
    <div id="flash"></div>
    <div id="barra-track"><div id="barra"></div></div>
    <div id="cuerpo">
      <div id="izq">
        <div id="tw"><div id="tit"></div></div>
        <div id="ops"></div>
        <div id="resp"><div id="rt"></div></div>
      </div>
      <div id="reloj"><div id="rl">TIEMPO</div><div id="timer">00:20</div></div>
    </div>
  </div>
  <div id="cartelw" class="abs"><div id="cartel"><div id="c1"></div><div id="c2"></div></div></div>
</div>
<script>
const B='http://127.0.0.1:8769';
const CAM={chicos:{x:66,y:141,w:651,h:635},mid:{x:760,y:141,w:398,h:635},chicas:{x:1202,y:141,w:651,h:635}};
const TEAMS=['chicos','chicas'],KEYS=['llamada','saltar','cambiar','5050'],INI={llamada:'L',saltar:'S',cambiar:'C','5050':'50'},LET=['A','B','C','D'];
const TCOL={chicos:'#1E5BFF',chicas:'#ff2bb0'};
const $=id=>document.getElementById(id),root=$('root'),pan=$('pan'),tit=$('tit'),tw=$('tw'),els={},prev={},last={};
let S=null;
// --- comodines (si la imagen falla: circulo de respaldo con la inicial)
let dd=0;
TEAMS.forEach(t=>{els[t]={};KEYS.forEach(k=>{
  const c=document.createElement('div');c.className='cm';c.style.setProperty('--d',(-(dd++)*0.35)+'s');c.style.setProperty('--tc',TCOL[t]);
  const on=new Image(),off=new Image(),fb=document.createElement('div');on.className='on';off.className='off';fb.className='fb';fb.textContent=INI[k];
  const fail=()=>c.classList.add('fallback');on.onerror=fail;off.onerror=fail;
  on.src=B+'/img/'+t+'_'+k+'_activa.png';off.src=B+'/img/'+t+'_'+k+'_apagada.png';on.draggable=off.draggable=false;
  c.append(on,off,fb);$('t-'+t).append(c);els[t][k]=c;});});
// --- opciones
const ops=[];for(let i=0;i<4;i++){const o=document.createElement('div');o.className='op slot';o.style.display='none';
  o.innerHTML='<div class="k">'+LET[i]+'</div><div class="t"></div>';$('ops').append(o);ops.push(o);}
// --- sonidos
const SN={};['usar','reactivar','inicio','campana','acierto','error','redoble'].forEach(n=>{const a=new Audio(B+'/sonido/'+n);a.preload='auto';SN[n]=a;});
const tic=new Audio(B+'/sonido/tictac');tic.loop=true;tic.preload='auto';let ticOn=false;
const volObs=(s,n)=>Math.max(0,Math.min(1,((s&&s.vol&&s.vol[n])?s.vol[n].obs:100)/100));
function play(s,n){const a=SN[n];if(!a)return;a.volume=volObs(s,n);try{a.currentTime=0;const p=a.play();p&&p.catch&&p.catch(()=>{});}catch(e){}}
function setTic(on){tic.volume=volObs(S,'tictac');
  if(on&&!ticOn){ticOn=true;try{const p=tic.play();p&&p.catch&&p.catch(()=>{ticOn=false;});}catch(e){ticOn=false;}}
  else if(!on&&ticOn){ticOn=false;try{tic.pause();tic.currentTime=0;}catch(e){}}}
['pointerdown','keydown','mousedown'].forEach(ev=>addEventListener(ev,()=>{Object.values(SN).forEach(a=>{try{a.muted=true;const p=a.play();
  const done=()=>{a.pause();a.currentTime=0;a.muted=false};p&&p.then?p.then(done).catch(()=>{a.muted=false}):done();}catch(e){}})},{once:true}));
// --- utilidades
function anim(c,cls){c.classList.remove('slam','revive');void c.offsetWidth;c.classList.add(cls);clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove(cls),900);}
function fit(el,box,max,min){let f=max;el.style.fontSize=f+'px';while(f>min&&(el.offsetHeight>box.clientHeight+1||el.scrollWidth>el.clientWidth+1)){f-=2;el.style.fontSize=f+'px';}}
function fitW(el,max,min){let f=max;el.style.fontSize=f+'px';while(f>min&&el.scrollWidth>el.parentNode.clientWidth-52){f-=2;el.style.fontSize=f+'px';}}
const fmt=r=>String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
function setTxt(el,t){if(el.textContent!==t)el.textContent=t;}
function setCls(el,c,v){if(el.classList.contains(c)!==!!v)el.classList.toggle(c,!!v);}   // solo toca la clase si cambia
function pop(el,v){const t=String(v);if(el.textContent!==t){const nuevo=!el._seen;el._seen=1;el.textContent=t;el.setAttribute('data-t',t);if(!nuevo){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}}}
// --- reloj fluido: se interpola con performance.now() entre lectura y lectura (restante_ms, CONTRATO)
const TM={rest:20000,total:20000,corr:false,at:performance.now(),sec:-1,band:-1,tic:false};
const tm=$('timer'),barra=$('barra');
function frame(){
  const now=performance.now();let r=TM.rest;if(TM.corr)r=Math.max(0,TM.rest-(now-TM.at));
  const pct=TM.total>0?Math.max(0,Math.min(1,r/TM.total)):1;
  barra.style.transform='scaleX('+pct+')';
  const sec=Math.ceil(r/1000-1e-6);if(sec!==TM.sec){TM.sec=sec;tm.textContent=fmt(sec);}
  const band=TM.total<=0?0:pct<=.25?2:pct<=.5?1:0;           // 0 blanco, 1 amarillo (50 %), 2 rojo (25 %)
  if(band!==TM.band){TM.band=band;setCls(tm,'amarillo',band===1);setCls(tm,'rojo',band===2);setCls(barra,'amarilla',band===1);setCls(barra,'roja',band===2);}
  const tic=!!(TM.corr&&sec>0&&sec<=((S&&S.tic_desde)||10));if(tic!==TM.tic){TM.tic=tic;setTic(tic);}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
let calKey='',txtKey='',avN=null,opKey='',prevRes=null,prevQ=-1;
function layout(cal){
  const k=JSON.stringify(cal);if(k===calKey)return;calKey=k;
  const s=cal.size||150;
  TEAMS.forEach(t=>{const cam=CAM[t];KEYS.forEach((key,i)=>{const c=els[t][key];
    c.style.width=c.style.height=s+'px';
    c.style.left=(cam.x+i*(cam.w-s)/3+(cal[t+'_dx']||0))+'px';
    c.style.top=((cam.y-s)/2+(cal.dy||0))+'px';});
    const r=$('ring-'+t);r.style.left=(cam.x-7)+'px';r.style.top=(cam.y-7)+'px';r.style.width=(cam.w+4)+'px';r.style.height=(cam.h+4)+'px';});
  const top=792+(cal.pan_dy||0);pan.style.top=top+'px';pan.style.height=Math.max(150,Math.min(cal.pan_h||280,1074-top))+'px';
  [['g1','chicos'],['g2','mid'],['g3','chicas']].forEach(([id,k])=>{const g=$(id),c=CAM[k];g.style.left=c.x+'px';g.style.top=c.y+'px';g.style.width=(c.w-4)+'px';g.style.height=(c.h-4)+'px';g.textContent=k.toUpperCase();});
  document.body.classList.toggle('g',!!cal.guia);txtKey='';
}
function pintar(s){
  S=s;
  setCls(root,'off',!s.visible);
  layout(s.cal||{});
  ['usar','reactivar','inicio','campana','acierto','error','redoble'].forEach(n=>{const v=s['p_'+n];if(last[n]!==undefined&&v!==last[n])play(s,n);last[n]=v;});
  // comodines: siempre visibles; se atenuan los que no valen en la ronda
  const val=Array.isArray(s.comodines_validos)?s.comodines_validos:null;
  TEAMS.forEach(t=>KEYS.forEach(k=>{const c=els[t][k],u=!!(s.usados&&s.usados[t]&&s.usados[t][k]);setCls(c,'used',u);setCls(c,'noval',val&&!val.includes(k));
    const id=t+k;if(prev[id]!==undefined&&prev[id]!==u)anim(c,u?'slam':'revive');prev[id]=u;}));
  // turno + marcador
  setCls($('ring-chicos'),'on',s.turno==='chicos');setCls($('ring-chicas'),'on',s.turno==='chicas');
  setCls(pan,'t-chicos',s.turno==='chicos');setCls(pan,'t-chicas',s.turno==='chicas');
  pop($('pc'),s.puntos.chicos);pop($('pm'),s.puntos.chicas);
  // cartel de ronda / tema (formato del CONTRATO)
  const R=s.ronda,T=s.tema,cart=$('cartel');
  if(R){const col=(T&&T.color)||R.color||'#38bdf8',pt=R.puntos;
    {const c1=$('c1'),t1=((T&&T.nombre)||R.nombre||'').replace(/\s*[-–·:]?\s*nivel\s+experto/ig,'').trim().toUpperCase();if(c1.textContent!==t1){c1.textContent=t1;let f=26;c1.style.fontSize=f+'px';while(f>14&&c1.scrollWidth>c1.clientWidth+1){f-=1;c1.style.fontSize=f+'px';}}}
    setTxt($('c2'),R.n+' / '+R.total+(R.reserva?' · RESERVA':'')+' · VALE '+pt+(pt>1?' PTS':' PT'));
    cart.style.setProperty('--c',col);setCls(cart,'on',true);}else setCls(cart,'on',false);
  // aviso de comodin
  const av=s.aviso||{n:0};
  if(avN!==null&&av.n!==avN&&av.n>0){$('a1').textContent=av.l1||'';$('a2').textContent=av.txt||'';$('av').style.setProperty('--c',av.col||'#fff');
    const a=$('av'),m=$('mid');a.classList.remove('on');void a.offsetWidth;a.classList.add('on');m.classList.add('aviso');clearTimeout(a._t);a._t=setTimeout(()=>{m.classList.remove('aviso');a.classList.remove('on');},3400);}
  avN=av.n;
  // ---- panel inferior
  const f=s.fase,ini=f==='inicio',tv=(s.titulo_visible!==undefined?!!s.titulo_visible:!!(s.titulo&&s.titulo.trim()));
  const mostrar=!ini||(tv&&!!s.titulo);                // titulo vacio: no se muestra nada
  setCls(pan,'off',!mostrar);setCls(pan,'inicio',ini);setCls(pan,'jugando',!ini);
  const txt=ini?(s.titulo||''):(s.preg?s.preg.texto:''),key=(ini?'T':'Q'+s.qid)+'|'+txt+'|'+(s.cal&&s.cal.pan_h);
  if(key!==txtKey){const nuevoQ=txtKey.split('|')[0]!==key.split('|')[0];txtKey=key;tit.textContent=txt;tit.setAttribute('data-t',txt);
    if(ini)fit(tit,tw,150,40);else fit(tit,tw,58,26);
    if(nuevoQ&&txt){tit.classList.remove('animar');void tit.offsetWidth;tit.classList.add('animar');}}
  const P=(ini||!s.preg)?null:s.preg,oc=s.ocultas||[],abierta=!!P&&(s.tipo==='abierta'||P.opciones.length===0),rev=f==='revelada';
  $('ops').style.display=(P&&!abierta)?'flex':'none';
  const opk=s.qid+'|'+f;const entrar=opk!==opKey&&f==='opciones';opKey=opk;
  ops.forEach((o,i)=>{
    if(!P||abierta||i>=P.opciones.length){o.style.display='none';return;}
    o.style.display='flex';const tx=P.opciones[i]||'',te=o.children[1];
    if(te.textContent!==tx){te.textContent=tx;te.style.fontSize=tx.length<=22?'30px':tx.length<=38?'25px':'21px';}
    setCls(o,'slot',f==='pregunta');setCls(o,'hid',oc.includes(i));
    setCls(o,'sel',!rev&&s.elegida===i&&!oc.includes(i));setCls(o,'ok',rev&&s.correcta===i);
    setCls(o,'bad',rev&&s.elegida===i&&s.correcta!==i);setCls(o,'dim',rev&&s.correcta!==i&&s.elegida!==i);
    if(entrar){o.style.setProperty('--dl',(i*0.12)+'s');o.classList.remove('go');void o.offsetWidth;o.classList.add('go');}
  });
  const rs=$('resp');setCls(rs,'abierta',abierta);
  if(abierta){const ra=rev?(s.respuesta||''):'?  ?  ?';setCls(rs,'ok',rev);setCls(rs,'oculta',!rev);
    if($('rt').textContent!==ra){setTxt($('rt'),ra);fitW($('rt'),44,20);}}
  // destello al revelar acierto / error
  if(s.qid!==prevQ){prevQ=s.qid;prevRes=null;}
  if(s.resultado&&s.resultado!==prevRes){const fl=$('flash');fl.style.setProperty('--fc',s.resultado==='acierto'?'#22c55e':'#ef4444');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');}
  prevRes=s.resultado||null;
  // reloj (lo dibuja frame())
  const T2=s.timer;TM.rest=T2.restante_ms!==undefined?T2.restante_ms:(T2.resto!==undefined?T2.resto*1000:T2.restante*1000);
  TM.total=T2.total_ms!==undefined?T2.total_ms:T2.total*1000;TM.corr=!!T2.corriendo;TM.at=performance.now();
  const rl=$('rl');setTxt(rl,T2.llamada?'LLAMADA A UN AMIGO':(T2.etiqueta||'TIEMPO'));setCls(rl,'ll',!!T2.llamada);
}
let busy=false;
async function leer(){if(busy)return;busy=true;try{const r=await fetch(B+'/state',{cache:'no-store'});if(r.ok)pintar(await r.json());}catch(e){}busy=false;}
setInterval(leer,200);leer();
