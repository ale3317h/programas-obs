<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Preguntas - Overlay OBS</title>
<style>
* {box-sizing:border-box}
html,body {margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#root {position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
#msg {font:900 48px Arial;color:#0f0;text-shadow:0 0 12px #0f0}
#det {font:24px Arial;color:#aaa;margin-top:20px}
#conn {font:28px Arial;color:#fde047;margin-top:10px}
</style></head><body>
<div id="root">
  <div id="msg">OVERLAY PREGUNTAS</div>
  <div id="det">Esperando servidor...</div>
  <div id="conn">http://127.0.0.1:8769/state</div>
</div>
<script>
const B='http://127.0.0.1:8769';
const msg=document.getElementById('det'),conn=document.getElementById('conn');
function set(el,t){el.textContent=t;}
async function leer(){
  try{
    const r=await fetch(B+'/state',{cache:'no-store'});
    if(r.ok){set(msg,'Servidor responde: OK');set(conn,'Conectado a '+B);msg.style.color='#0f0';}
    else {set(msg,'Servidor responde pero error: '+r.status);set(conn,B);msg.style.color='#ff4444';}
  }catch(e){set(msg,'No conecta con el servidor');set(conn,B);msg.style.color='#ff4444';}
}
setInterval(leer,500);leer();
</script></body></html>
